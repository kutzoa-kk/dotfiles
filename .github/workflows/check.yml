name: CI

on: [push]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test codex security hooks
        run: make test-codex-security-hooks
      - name: Test plugins-sync
        run: make test-plugins-sync
      - name: Test worklog
        run: make test-worklog
